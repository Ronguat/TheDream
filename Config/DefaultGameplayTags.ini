; --- Abilities: one tag per move in the 3-point offense / 3-point defense ---
+GameplayTagList=(Tag="Ability.Attack.Light",DevComment="Release LMB before 150ms; hits at 200ms. String opener; reactable but tight.")
+GameplayTagList=(Tag="Ability.Attack.Heavy",DevComment="Hold LMB past 150ms, release before 450ms; hits at 500ms.")
+GameplayTagList=(Tag="Ability.Attack.Charged",DevComment="Hold LMB past 450ms; hits at 750ms. Block-breaking, very reactable.")
+GameplayTagList=(Tag="Ability.Defend.Block",DevComment="Hold RMB. 180 degree forward coverage.")
+GameplayTagList=(Tag="Ability.Defend.Dodge",DevComment="LShift. Directional, 50 stamina, i-frames.")
+GameplayTagList=(Tag="Ability.Defend.Parry",DevComment="MB4 / LAlt+RMB. 400ms window, 360 degree coverage.")

; --- Inputs: the button, not the move. One InputTag.Attack press resolves to Light,
; --- Heavy or Charged depending on hold duration. Block and Parry deliberately do not
; --- share a button: both must be active on the frame they are pressed.
+GameplayTagList=(Tag="InputTag.Attack",DevComment="LMB. Resolves to Light/Heavy/Charged by hold duration.")
+GameplayTagList=(Tag="InputTag.Block",DevComment="RMB held.")
+GameplayTagList=(Tag="InputTag.Dodge",DevComment="LShift.")
+GameplayTagList=(Tag="InputTag.Parry",DevComment="MB4 or LAlt+RMB.")
+GameplayTagList=(Tag="InputTag.Jump",DevComment="Space. Routes to GA_Jump; jump stopped being a hand-gated call 2026-08-20.")

; --- States: applied while an ability is active, or as a reaction ---
+GameplayTagList=(Tag="State.Attacking",DevComment="Present from the press. Blocks overlapping attack activations.")
+GameplayTagList=(Tag="State.Attacking.Committed",DevComment="Applied at the commit checkpoint. Defensive actions cancel an attack before this, never after.")
+GameplayTagList=(Tag="State.Blocking",DevComment="Block is held and active.")
+GameplayTagList=(Tag="State.Dodging",DevComment="Dodge i-frames are active.")
+GameplayTagList=(Tag="State.Parrying",DevComment="Parry window is active.")
+GameplayTagList=(Tag="State.Hitstun",DevComment="Brief; combos are possible during this.")
+GameplayTagList=(Tag="State.Knockdown",DevComment="Downed; get-up options available.")
+GameplayTagList=(Tag="State.Exhausted",DevComment="Stamina hit 0. No defensive actions or jump until the bar refills to full.")
+GameplayTagList=(Tag="State.StaminaRegenPaused",DevComment="Suppresses stamina regen: held during a dodge, block or attack, then StaminaRegenPauseSeconds after.")

; Event.Melee.*, Data.*, and the C++-plumbed State tags — State.Dead, State.GuardBroken,
; State.Blockstun, State.Blocking.Committed — are declared natively in
; Source/TheDream/Combat/TDGameplayTags.h instead of here, so that C++ referencing them by name
; fails at compile time rather than resolving to an empty tag. They still appear in the tag picker.
